name: wallpaperx
description: "HD Wallpaper App - WallpaperX"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  dio: 5.11.1
  cached_network_image: 4.0.0
  provider: ^6.1.1
  hive_flutter: ^1.1.0
  path_provider: 2.1.6
  shimmer: 4.0.0
  permission_handler: 13.0.2
  share_plus: 13.3.0
  connectivity_plus: 7.3.1
  shared_preferences: 2.5.5
  url_launcher: 6.3.2
  flutter_dotenv: ^6.0.1
  shared_preferences_android: 2.4.28
  url_launcher_android: 6.3.33
  flutter_cache_manager: ^3.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: 6.0.0
  flutter_launcher_icons: 0.14.4
  http_mock_adapter: ^0.6.1
  network_image_mock: ^2.1.1
  file: ^7.0.1
flutter:
  uses-material-design: true
  assets:
    - .env

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#6366F1"
  adaptive_icon_foreground: "assets/icon/app_icon.png"