name: wallpaperx
description: "HD Wallpaper App - WallpaperX"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  dio: ^5.3.0
  cached_network_image: ^3.2.3
  provider: ^6.1.1
  hive_flutter: ^1.1.0
  path_provider: ^2.1.0
  shimmer: ^3.0.0
  permission_handler: ^11.0.0
  share_plus: ^7.2.0
  connectivity_plus: ^6.0.3
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#6366F1"
  adaptive_icon_foreground: "assets/icon/app_icon.png"